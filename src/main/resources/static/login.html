<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow | Secure Portal Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center p-4 antialiased">

<!-- Background Ambient Glow -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full bg-brand-500/20 blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full bg-emerald-500/10 blur-3xl"></div>
</div>

<!-- Login Card -->
<div class="relative w-full max-w-md bg-white/95 backdrop-blur-xl p-8 sm:p-10 rounded-3xl shadow-2xl border border-white/20">
    
    <!-- Branding Header -->
    <header class="text-center mb-8">
        <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 items-center justify-center text-white text-2xl shadow-lg shadow-brand-500/30 mb-4">
            <i class="fa-solid fa-boxes-stacked"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">StockFlow IMS</h1>
        <p class="text-xs text-slate-500 mt-1">Sign in to access your designated role portal</p>
    </header>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
        
        <!-- Username Input -->
        <div>
            <label for="username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                Username
            </label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                    <i class="fa-solid fa-user"></i>
                </span>
                <input type="text" id="username" required placeholder="admin or cashier1"
                       class="w-full pl-10 pr-3.5 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition duration-150">
            </div>
        </div>

        <!-- Password Input -->
        <div>
            <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                Password
            </label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                    <i class="fa-solid fa-lock"></i>
                </span>
                <input type="password" id="password" required placeholder="••••••••"
                       class="w-full pl-10 pr-3.5 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition duration-150">
            </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
            <button type="submit" id="loginButton"
                    class="w-full py-3.5 px-4 rounded-xl text-white font-bold text-sm bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 shadow-md shadow-brand-500/20 hover:shadow-lg transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </div>
    </form>

    <!-- Quick Fill Demo Credentials -->
    <div class="mt-6 pt-5 border-t border-slate-100 text-center">
        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2.5">Quick Demo Accounts</p>
        <div class="flex items-center justify-center gap-2">
            <button type="button" onclick="fillCredentials('admin', 'admin123')"
                    class="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition duration-150 cursor-pointer">
                👤 Admin
            </button>
            <button type="button" onclick="fillCredentials('cashier1', 'cash123')"
                    class="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition duration-150 cursor-pointer">
                🛒 Cashier
            </button>
        </div>
    </div>
</div>

<!-- Toast Notification Container -->
<div id="toastContainer" class="fixed bottom-5 right-5 space-y-2 z-50"></div>

<script>
    const API_BASE_URL = '/api/auth/login';

    function fillCredentials(user, pass) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
    });

    async function handleLogin(event) {
        event.preventDefault();
        const form = event.target;
        const username = form.username.value.trim();
        const password = form.password.value;
        const loginButton = document.getElementById('loginButton');

        if (!username || !password) {
            showToast('Please enter both username and password.', 'error');
            return;
        }

        loginButton.disabled = true;
        loginButton.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...`;

        try {
            const response = await fetch(API_BASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });

            if (response.ok) {
                const user = await response.json();
                showToast(`Welcome back, ${user.username}! Redirecting to ${user.role} view...`, 'success');

                setTimeout(() => {
                    const cacheBuster = '?v=' + Date.now();
                    if (user.role === 'admin') {
                        window.location.href = 'index.html' + cacheBuster;
                    } else if (user.role === 'cashier') {
                        window.location.href = 'cashier.html' + cacheBuster;
                    } else {
                        showToast('Unknown user role.', 'error');
                    }
                }, 800);

            } else if (response.status === 401) {
                showToast('Invalid credentials. Please verify username and password.', 'error');
            } else {
                showToast(`Login failed with status ${response.status}`, 'error');
            }
        } catch (error) {
            console.error('Login error:', error);
            showToast('Network error. Unable to connect to backend.', 'error');
        } finally {
            loginButton.disabled = false;
            loginButton.innerHTML = `<span>Sign In</span><i class="fa-solid fa-arrow-right text-xs"></i>`;
        }
    }

    function showToast(message, type = 'info', duration = 3500) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');

        const icons = {
            success: 'fa-circle-check text-emerald-500',
            error: 'fa-circle-xmark text-rose-500',
            info: 'fa-circle-info text-brand-500'
        };

        toast.className = `flex items-center gap-2.5 px-4 py-3 bg-white border border-slate-200 rounded-xl shadow-xl text-xs font-semibold text-slate-800 transition-all duration-300 transform translate-y-3 opacity-0`;
        toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-base"></i><span>${escapeHtml(message)}</span>`;

        container.appendChild(toast);
        setTimeout(() => toast.classList.remove('translate-y-3', 'opacity-0'), 10);
        setTimeout(() => {
            toast.classList.add('translate-y-3', 'opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, duration);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
